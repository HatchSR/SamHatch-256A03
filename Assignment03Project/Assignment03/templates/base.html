<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} 256 A03 {% endblock title %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/d2e78ba9e6.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div>
                    {% block welcome %}
                        <h1 class="text-2xl font-semibold tracking-tight text-gray-900">ITAS 256 Assignment 03</h1>
                    {% endblock welcome %}
                </div>
                <nav class="hidden md:flex items-center space-x-6">
                    <a href="{% url 'events' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                    {% if user.is_authenticated %}
                        {% if request.session.role == 'Admin' %}
                        <a href="{% url 'userreports' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                            <i class="fa-solid fa-users"></i>
                            <span>Users</span>
                        </a>
                        <a href="{% url 'adminEvents' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span>Admin Event View</span>
                        </a>
                        {% endif %}
                        <a href="{% url 'registeredevents' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                            <i class="fa-solid fa-ticket"></i>
                            <span>Registered Events</span>
                        </a>
                        <a href="{% url 'logoutaccount' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Logout</span>
                        </a>
                    {% else %}
                        <a href="{% url 'loginaccount' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                            <i class="fa-solid fa-user"></i>
                            <span>Login</span>
                        </a>
                        <a href="{% url 'signupaccount' %}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors duration-200">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Sign up</span>
                        </a>
                    {% endif %}
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow-sm rounded-lg p-6">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
