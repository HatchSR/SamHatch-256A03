{% extends "base.html" %}
{%block content%}
<div class = 'max-w-md mx-auto by-white p-6 rounded-lg shadow-md'>
    <h2 class = 'text-2xl font-bold mb-4'>login</h2>
    {% if error %}
    <div class = 'text-red-500 font-bold text-md mt-2'>
        {{error}}
    </div>
    {% endif%}
    <p class = 'mb-4'>
        <form method = "POST">
            {% csrf_token %}
            {{form.as_p}}
            <br>
            <p class = 'mb-4'>
                <button type = 'submit' class = 'bg-blue-500 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded'>Login</button>
            </p>
        </form>
    </p>
</div>
{%endblock content%}
