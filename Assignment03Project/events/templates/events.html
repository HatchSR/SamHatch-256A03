{% extends "base.html" %}
{%block content%}
<h2>hi this is the events page</h2>
{% if events%}
    {%for event in events%}
    <div>
        <h2>{{event.name}}</h2>
        <h3>{{event.description}}</h3>
        <h4>{{event.start_date}} - {{event.end_date}}</h4>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="event_id" value="{{ event.id }}">
            <button name="delete_event" value="true" type="submit" class="bg-blue-500 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">
                <i class="fa-solid fa-trash"></i> Register for Event
            </button>
        </form>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="event_id" value="{{ event.id }}">
            <button name="delete_event" value="true" type="submit" class="bg-blue-500 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">
                <i class="fa-solid fa-trash"></i> Delete Event
            </button>
        </form>
        

    {%endfor%}
{%else%}
<h2> No events</h2>
{%endif%}
{%endblock content%}
